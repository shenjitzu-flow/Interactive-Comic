<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mate's Story</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .flip-book { width: 100vw; height: 100vh; }
        .page { background-color: #111; }
        .page img { width: 100%; height: 100%; object-fit: contain; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffcc00; border: none; border-radius: 30px; padding: 15px 40px; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 1000; }
        #play-pause-btn { display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #ffcc00; border: none; border-radius: 50%; width: 70px; height: 70px; font-size: 30px; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <button id="start-btn">▶️ EMPEZAR</button>
    <button id="play-pause-btn">⏸️</button>
    <div class="flip-book" id="comic-book"></div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <script>
        const pages = [
            { id: 0, image: "cover.png", audio: ["cover.mp3"] },
            { id: 1, image: "p1.png", audio: ["p1.mp3", "p2.mp3"] }, // Playlist por página
            { id: 2, image: "p2.png", audio: [] }, 
            { id: 3, image: "p3.png", audio: ["p3.mp3", "p4.mp3"] },
            { id: 4, image: "p4.png", audio: [] },
            { id: 5, image: "p5.png", audio: ["p5.mp3", "p6.mp3"] },
            { id: 6, image: "p6.png", audio: [] },
            { id: 7, image: "p7.png", audio: ["p7.mp3", "p8.mp3"] },
            { id: 8, image: "p8.png", audio: [] },
            { id: 9, image: "p9.png", audio: ["p9.mp3", "p10.mp3"] },
            { id: 10, image: "p10.png", audio: [] }
        ];

        const container = document.getElementById('comic-book');
        const startBtn = document.getElementById('start-btn');
        const playPauseBtn = document.getElementById('play-pause-btn');
        
        let currentAudio = null;
        let isPlaying = false;
        let currentPageIdx = -1;
        let currentAudioIdx = 0;

        // Renderizar páginas
        pages.forEach(p => {
            const div = document.createElement('div');
            div.className = 'page';
            div.innerHTML = `<img src="images/${p.image}">`;
            container.appendChild(div);
        });

        const pageFlip = new St.PageFlip(container, {
            width: 500, height: 888, size: "stretch", showCover: true, usePortrait: true, flippingTime: 800,
            mobileScrollSupport: false // Evita interferencias en táctil
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        function killAudio() {
            if (currentAudio) {
                currentAudio.onended = null;
                currentAudio.pause();
                currentAudio = null;
            }
        }

        function playAudioQueue(pageIdx, audioIdx) {
            killAudio();
            currentPageIdx = pageIdx;
            currentAudioIdx = audioIdx;

            const audioList = pages[pageIdx].audio;
            
            // Si no hay audios en esta página
            if (!audioList || audioList.length === 0 || !audioList[audioIdx]) {
                if (isPlaying && pageIdx < pages.length - 1) {
                    // Espera un momento para que vean la imagen y voltea
                    setTimeout(() => {
                        if (isPlaying && pageFlip.getCurrentPageIndex() === pageIdx) {
                            pageFlip.turnToPage(pageIdx + 1);
                        }
                    }, 2500);
                }
                return;
            }

            // Cargar y reproducir el audio actual de la lista
            currentAudio = new Audio(`audio/${audioList[audioIdx]}`);
            
            if (isPlaying) {
                currentAudio.play().catch(e => console.error("Error cargando:", audioList[audioIdx]));
            }

            currentAudio.onended = () => {
                if (audioIdx + 1 < audioList.length) {
                    // Hay más audios en esta misma página
                    playAudioQueue(pageIdx, audioIdx + 1);
                } else {
                    // Se acabaron los audios de la página, saltar a la siguiente
                    if (isPlaying && pageIdx < pages.length - 1) {
                        pageFlip.turnToPage(pageIdx + 1);
                    } else if (pageIdx === pages.length - 1) {
                        isPlaying = false;
                        playPauseBtn.innerHTML = '▶️';
                    }
                }
            };
        }

        // Evento maestro de la librería
        pageFlip.on('flip', (e) => {
            // Solo disparamos si realmente cambió la página
            if (currentPageIdx !== e.data) {
                playAudioQueue(e.data, 0);
            }
        });

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            playPauseBtn.style.display = 'block';
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            playAudioQueue(pageFlip.getCurrentPageIndex(), 0);
        });

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseBtn.innerHTML = isPlaying ? '⏸️' : '▶️';
            
            if (currentAudio) {
                isPlaying ? currentAudio.play() : currentAudio.pause();
            } else if (isPlaying) {
                playAudioQueue(pageFlip.getCurrentPageIndex(), 0);
            }
        });
    </script>
</body>
</html>
