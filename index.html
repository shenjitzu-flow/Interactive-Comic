<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mate's Daily Routine</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .flip-book {
            width: 100vw;
            height: 100vh;
        }
        .page {
            background-color: #111;
            overflow: hidden;
            position: relative;
        }
        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffcc00;
            color: #111;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 1000;
            transition: transform 0.1s;
        }
        #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
    </style>
</head>
<body>

    <button id="start-btn">▶️ START STORY</button>
    <div class="flip-book" id="comic-book"></div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <script>
        const pages = [
            { id: "cover", image: "cover.png", audio: "cover.mp3" },
            { id: "1", image: "p1.png", audio: "p1n.mp3" },
            { id: "2", image: "p2.png", audio: "" },
            { id: "3", image: "p3.png", audio: "p3n.mp3" },
            { id: "4", image: "p4.png", audio: "" },
            { id: "5", image: "p5.png", audio: "p5n.mp3" },
            { id: "6", image: "p6.png", audio: "" },
            { id: "7", image: "p7.png", audio: "p7n.mp3" },
            { id: "8", image: "p8.png", audio: "" },
            { id: "9", image: "p9.png", audio: "p9n.mp3" },
            { id: "10", image: "p10.png", audio: "" }
        ];

        const container = document.getElementById('comic-book');
        const startBtn = document.getElementById('start-btn');
        let currentAudio = null;
        let isAutoPlaying = false;

        // Inyectar DOM (ya sin botones por página)
        pages.forEach(page => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.innerHTML = `<img src="images/${page.image}" alt="Page ${page.id}">`;
            container.appendChild(pageDiv);
        });

        // Configuración PageFlip
        const pageFlip = new St.PageFlip(container, {
            width: 500,
            height: 888,
            size: "stretch",
            showCover: true,
            usePortrait: true,
            maxShadowOpacity: 0.5,
            flippingTime: 700
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        // Controlador de Audio
        function playAudioForPage(index) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if (index >= pages.length) return; // Detiene el loop si llegó al final

            currentAudio = new Audio(`audio/${pages[index].audio}`);
            currentAudio.play().catch(e => console.log("Audio faltante/Error:", pages[index].audio));

            // Hook: cuando termina la pista, voltea la página
            currentAudio.onended = () => {
                if (isAutoPlaying && index < pages.length - 1) {
                    pageFlip.flipNext();
                }
            };
        }

        // Hook: Sincroniza el audio si el usuario arrastra la página manualmente
        pageFlip.on('flip', (e) => {
            if (isAutoPlaying) {
                playAudioForPage(e.data); // e.data trae el índice de la nueva página
            }
        });

        // Botón Maestro para evadir bloqueo de CORS/Autoplay
        startBtn.addEventListener('click', () => {
            isAutoPlaying = true;
            startBtn.style.display = 'none'; // Quita el botón de la pantalla
            playAudioForPage(pageFlip.getCurrentPageIndex()); // Detona el ciclo desde la portada
        });
    </script>
</body>
</html>
